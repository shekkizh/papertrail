<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperTrail — a literature review canvas for you and your agent</title>
  <meta name="description" content="PaperTrail exposes your literature-review workspace to AI agents through WebMCP. You curate and judge; your agent searches, annotates, compares, and drafts — on the same canvas, with full provenance." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e6b5c'/%3E%3Cpath d='M8 9h11M8 13h16M8 17h16M8 21h10' stroke='%23f5f1e8' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M8 9h11M8 13h16M8 17h16M8 21h10" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="brand-name">PaperTrail</span>
      <span class="brand-sub">literature review, together</span>
    </div>
    <div class="ws-title-wrap">
      <span id="ws-title" contenteditable="spellcheck-false" title="Click to rename your survey">Untitled survey</span>
    </div>
    <div class="topbar-actions">
      <span id="agent-status" class="status-chip" title="WebMCP status">…</span>
      <button id="demo-btn" class="btn btn-outline">▶ Guided demo</button>
      <div class="menu-wrap">
        <button id="export-btn" class="btn btn-outline">Export ▾</button>
        <div id="export-menu" class="menu" hidden>
          <button data-fmt="markdown">Markdown</button>
          <button data-fmt="bibtex">BibTeX</button>
          <button data-fmt="json">JSON</button>
        </div>
      </div>
      <button id="reset-btn" class="btn btn-ghost" title="Clear workspace">reset</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <aside id="search-rail" class="rail rail-left"></aside>
    <section id="board" class="board" aria-label="Workspace canvas"></section>
    <aside id="inspector" class="rail rail-right"></aside>
  </main>

  <noscript>PaperTrail needs JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
